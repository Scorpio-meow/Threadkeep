name: 擷取結果不正確
description: 沒有出現儲存提示、內文夾雜雜訊或缺漏、發文時間或作者抓錯、被誤判為失效貼文
title: "[擷取] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        擷取依賴 Threads 網頁的結構，官方改版時最容易出問題。請只附上**公開貼文**的資訊，不要貼出私人帳號或不想公開的內容。

  - type: input
    id: post-link
    attributes:
      label: 貼文網址
      description: 公開貼文的網址，例如 `https://www.threads.com/@user/post/abc123`
    validations:
      required: true

  - type: checkboxes
    id: problem
    attributes:
      label: 問題類型
      description: 可複選
      options:
        - label: 點了「取得內嵌程式碼」後沒有出現儲存提示
        - label: 內文多出 UI 雜訊（按鈕文字、追蹤人數、相對時間等）
        - label: 內文缺漏、換行被壓平或段落順序錯誤
        - label: 發文時間缺漏或錯誤
        - label: 作者或標籤錯誤
        - label: 「更新貼文資料」後被誤判為失效貼文

  - type: dropdown
    id: page-type
    attributes:
      label: 擷取時所在的頁面
      options:
        - 動態牆（首頁）
        - 貼文頁
        - 個人檔案頁
        - 搜尋或標籤結果
        - 背景更新（更新貼文資料）
        - 其他
    validations:
      required: true

  - type: dropdown
    id: ui-language
    attributes:
      label: Threads 介面語言
      description: 過濾規則因語言而不同
      options:
        - 繁體中文
        - English
        - 其他
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 實際擷取到的內容
      description: 從控制面板「原始碼與中繼資料」分頁複製，只需要有問題的欄位
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 應該擷取到的內容
      render: text

  - type: input
    id: version
    attributes:
      label: 擴充功能版本
      description: 在 `chrome://extensions/` 或 manifest.json 查看
      placeholder: "2.2.0"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 瀏覽器與版本
      placeholder: "Chrome 130"
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: 主控台訊息
      description: Threads 分頁按 F12 開啟主控台，貼上與擴充功能有關的錯誤或警告
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: 確認事項
      options:
        - label: 已搜尋過既有的 Issue，沒有相同的回報
          required: true
        - label: 使用的是 `main` 分支的最新版本
          required: true
