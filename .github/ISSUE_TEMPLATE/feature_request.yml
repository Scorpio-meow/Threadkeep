name: 功能建議
description: 提出新功能或既有功能的改善
title: "[功能] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本專案維持零依賴、零建置、資料只存在瀏覽器本機的設計。需要新增權限或對外連線的建議，請在下方說明理由。

  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 目前遇到什麼不便？在什麼情境下會用到？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建議的做法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案
      description: 例如用現有的篩選、匯出功能能否做到

  - type: dropdown
    id: scope
    attributes:
      label: 是否需要新的權限或對外連線
      options:
        - 不需要
        - 需要（請在上方說明）
        - 不確定
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 確認事項
      options:
        - label: 已搜尋過既有的 Issue，沒有相同的建議
          required: true
