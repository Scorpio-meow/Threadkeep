name: 功能異常
description: Popup、控制面板、即時預覽、更新佇列、匯入匯出等介面操作出錯
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        擷取內容不正確請改用「擷取結果不正確」範本；安全漏洞請依 [SECURITY.md](https://github.com/Scorpio-meow/Threads-embedded-code/blob/main/SECURITY.md) 私下回報。

  - type: dropdown
    id: area
    attributes:
      label: 發生的位置
      options:
        - Popup 彈出面板
        - 控制面板（Dashboard）
        - 即時預覽
        - 更新貼文資料（背景更新佇列）
        - 匯入
        - 匯出
        - Threads 頁面上的通知
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      placeholder: |
        1. 開啟控制面板
        2. 勾選兩篇貼文
        3. 點「批次刪除」
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 預期結果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 實際結果
      description: 可以附上截圖
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 擴充功能版本
      description: 在 `chrome://extensions/` 或 manifest.json 查看
      placeholder: "2.3.0"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 瀏覽器、版本與作業系統
      placeholder: "Chrome 130 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: 主控台訊息
      description: Popup 按右鍵選「檢查」、控制面板按 F12，貼上相關的錯誤或警告
      render: text

  - type: textarea
    id: context
    attributes:
      label: 補充資訊
      description: 例如收藏的貼文數量、是否在匯入大量資料後發生。若需附上備份檔，只保留與問題相關的那一筆。

  - type: checkboxes
    id: confirm
    attributes:
      label: 確認事項
      options:
        - label: 已搜尋過既有的 Issue，沒有相同的回報
          required: true
        - label: 使用的是 `main` 分支的最新版本
          required: true
