<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threadkeep</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
  <script src="theme.js"></script>
</head>

<body>
  <header class="popup-header">
    <div class="popup-title">
      <img class="popup-mark" src="icons/icon-32.png" alt="" width="24" height="24">
      <h1>已儲存的貼文 <span class="popup-total num" id="totalCount">0</span></h1>
    </div>
    <div class="popup-header-actions">
      <button class="btn btn-icon" id="openDashboardBtn" type="button" aria-label="開啟控制面板" title="開啟控制面板">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <line x1="9" y1="4" x2="9" y2="20" />
        </svg>
      </button>
      <button class="btn btn-icon" id="moreMenuBtn" type="button" popovertarget="moreMenu" aria-label="更多" title="更多">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"
          aria-hidden="true">
          <circle cx="5" cy="12" r="1.7" />
          <circle cx="12" cy="12" r="1.7" />
          <circle cx="19" cy="12" r="1.7" />
        </svg>
      </button>
    </div>
    <div class="menu" id="moreMenu" popover>
      <div class="menu-label" id="exportMenuLabel">匯出</div>
      <button class="menu-item" id="exportBtn" type="button" aria-labelledby="exportBtnTitle"
        aria-describedby="exportBtnHint">
        <span class="menu-item-text">
          <span id="exportBtnTitle"><span class="sr-only">匯出：</span>僅內嵌碼</span>
          <span class="menu-item-hint" id="exportBtnHint">貼進網頁用的 .js 檔</span>
        </span>
      </button>
      <button class="menu-item" id="exportFeaturedBtn" type="button" aria-labelledby="exportFeaturedBtnTitle"
        aria-describedby="exportFeaturedBtnHint">
        <span class="menu-item-text">
          <span id="exportFeaturedBtnTitle"><span class="sr-only">匯出：</span>精選格式</span>
          <span class="menu-item-hint" id="exportFeaturedBtnHint">Threadfolio 精選貼文用</span>
        </span>
      </button>
      <button class="menu-item" id="exportFullBtn" type="button" aria-labelledby="exportFullBtnTitle"
        aria-describedby="exportFullBtnHint">
        <span class="menu-item-text">
          <span id="exportFullBtnTitle"><span class="sr-only">匯出：</span>完整備份</span>
          <span class="menu-item-hint" id="exportFullBtnHint">含時間、作者與內文</span>
        </span>
      </button>
      <div class="menu-sep"></div>
      <button class="menu-item" id="importBtn" type="button">匯入…</button>
      <div class="menu-sep"></div>
      <button class="menu-item menu-item-danger" id="clearBtn" type="button">清除全部</button>
    </div>
  </header>
  <main class="popup-main">
    <div class="popup-controls">
      <div class="search">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <line x1="20" y1="20" x2="16.2" y2="16.2" />
        </svg>
        <label class="sr-only" for="searchInput">搜尋內文、作者、標籤或貼文連結</label>
        <input type="text" class="field" id="searchInput" placeholder="搜尋內文、作者、標籤或連結" autocomplete="off">
      </div>
      <div class="popup-toolbar">
        <label class="sr-only" for="filterSelect">篩選</label>
        <div class="select popup-filter">
          <select id="filterSelect" class="field">
            <option value="all">全部貼文</option>
            <option value="author">按作者</option>
            <option value="tag">按標籤</option>
            <option value="noContent">無內文</option>
            <option value="noTimestamp">無發文時間</option>
            <option value="expired">失效貼文</option>
          </select>
        </div>
        <div id="filterValueContainer" class="select popup-filter-value is-hidden">
          <label class="sr-only" for="filterValueSelect">篩選數值</label>
          <select id="filterValueSelect" class="field">
            <option value="">全部</option>
          </select>
        </div>
        <label class="sr-only" for="sortSelect">排序</label>
        <div class="select popup-sort">
          <select id="sortSelect" class="field">
            <option value="savedAt-desc">最新儲存</option>
            <option value="savedAt-asc">最早儲存</option>
            <option value="timestamp-desc">最新發文</option>
            <option value="timestamp-asc">最早發文</option>
            <option value="author-asc">作者 A–Z</option>
            <option value="author-desc">作者 Z–A</option>
          </select>
        </div>
      </div>
    </div>
    <div class="list-bar">
      <label class="list-bar-select">
        <input type="checkbox" class="check" id="selectAllCheckbox">
        <span>全選</span>
      </label>
      <span id="selectionInfo" class="list-bar-info num is-hidden"></span>
      <span class="list-bar-count num" id="articleCount">0 篇</span>
      <button class="btn btn-ghost btn-sm is-hidden" id="clearSelectionBtn" type="button">取消選取</button>
    </div>
    <section class="popup-list scroll-area" id="articlesScroll" aria-labelledby="articleListHeading">
      <h2 class="sr-only" id="articleListHeading" tabindex="-1">貼文列表</h2>
      <div class="article-list" id="articlesContainer">
        <div class="empty-state">
          <img class="empty-mascot" src="images/mascot-320.webp" alt="" width="320" height="334">
          <p class="empty-title">尚未儲存任何貼文</p>
          <p class="empty-description">在 Threads 貼文選單點「取得內嵌程式碼」</p>
        </div>
      </div>
      <div class="load-more-container" id="loadMoreContainer"></div>
    </section>
  </main>
  <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle"
    aria-describedby="confirmModalMessage" hidden>
    <div class="modal-container">
      <div class="modal-header">
        <h2 id="confirmModalTitle">確認操作</h2>
        <button class="modal-close-btn" id="confirmModalCloseBtn" type="button" aria-label="關閉對話框">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p id="confirmModalMessage"></p>
      </div>
      <div class="modal-footer">
        <button class="btn" id="confirmModalCancelBtn" type="button">取消</button>
        <button class="btn btn-danger-solid" id="confirmModalConfirmBtn" type="button">確定</button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="importSourceModal" role="dialog" aria-modal="true"
    aria-labelledby="importSourceModalTitle" hidden>
    <div class="modal-container">
      <div class="modal-header">
        <h2 id="importSourceModalTitle">匯入資料</h2>
        <button class="modal-close-btn" id="importSourceCloseBtn" type="button" aria-label="關閉對話框">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="choice-list">
          <button class="choice-option" id="importSourceFileBtn" type="button" aria-labelledby="importSourceFileTitle"
            aria-describedby="importSourceFileDesc">
            <span class="choice-title" id="importSourceFileTitle">選擇檔案</span>
            <span class="choice-desc" id="importSourceFileDesc">讀取先前匯出的 .js 或 .json 檔</span>
          </button>
          <button class="choice-option" id="importSourcePasteBtn" type="button" aria-labelledby="importSourcePasteTitle"
            aria-describedby="importSourcePasteDesc">
            <span class="choice-title" id="importSourcePasteTitle">貼上內容</span>
            <span class="choice-desc" id="importSourcePasteDesc">貼上匯出檔的文字</span>
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="importSourceCancelBtn" type="button">取消</button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="importPasteModal" role="dialog" aria-modal="true"
    aria-labelledby="importPasteModalTitle" hidden>
    <div class="modal-container">
      <div class="modal-header">
        <h2 id="importPasteModalTitle">貼上匯入內容</h2>
        <button class="modal-close-btn" id="importPasteCloseBtn" type="button" aria-label="關閉對話框">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="importPasteTextarea">匯出檔內容（JS 或 JSON）</label>
        <textarea id="importPasteTextarea" class="field" rows="8" spellcheck="false"></textarea>
        <p class="field-error is-hidden" id="importPasteError" role="alert"></p>
      </div>
      <div class="modal-footer">
        <button class="btn" id="importPasteCancelBtn" type="button">取消</button>
        <button class="btn btn-primary" id="importPasteNextBtn" type="button">下一步</button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="importModeModal" role="dialog" aria-modal="true" aria-labelledby="importModeModalTitle"
    aria-describedby="importModeModalMessage" hidden>
    <div class="modal-container">
      <div class="modal-header">
        <h2 id="importModeModalTitle">選擇匯入方式</h2>
        <button class="modal-close-btn" id="importModeCloseBtn" type="button" aria-label="關閉對話框">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p id="importModeModalMessage"></p>
        <div class="choice-list">
          <button class="choice-option" id="importModeMergeBtn" type="button" aria-labelledby="importModeMergeTitle"
            aria-describedby="importModeMergeDesc">
            <span class="choice-title" id="importModeMergeTitle">合併資料<span class="sr-only">（</span><span
                class="choice-tag">推薦</span><span class="sr-only">）</span></span>
            <span class="choice-desc" id="importModeMergeDesc">只加入還沒有的貼文，現有資料不變</span>
          </button>
          <button class="choice-option choice-option-danger" id="importModeOverwriteBtn" type="button"
            aria-labelledby="importModeOverwriteTitle" aria-describedby="importModeOverwriteDesc">
            <span class="choice-title" id="importModeOverwriteTitle">完全覆寫</span>
            <span class="choice-desc" id="importModeOverwriteDesc">刪除目前全部貼文，改以匯入的內容取代，無法復原</span>
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="importModeCancelBtn" type="button">取消匯入</button>
      </div>
    </div>
  </div>
  <div class="toast-container" id="toastContainer" role="status" aria-live="polite" aria-atomic="false"></div>
  <div class="sr-only" id="liveStatus" role="status" aria-live="polite" aria-atomic="true"></div>
  <input type="file" id="importFileInput" accept=".js,.json" class="is-hidden" title="匯入資料檔案">
  <script src="article-store.js"></script>
  <script src="ui.js"></script>
  <script src="sound.js"></script>
  <script src="popup.js"></script>
</body>

</html>
